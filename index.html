<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Playfair Display + Inter — paire « Classic Elegant » du référentiel de
      design. Playfair porte le caractère haut de gamme en gros corps grâce à sa
      forte modulation ; Inter reste lisible à 13px dans les tableaux du
      tableau de bord, ce qu'une géométrique comme Josefin ne fait pas.
      IBM Plex Mono est conservé : les montants sont partout en chiffres
      tabulaires, et une troisième famille dédiée aux données est un parti pris
      éditorial, pas un reliquat.
      `display=swap` : le texte s'affiche dans la police de repli plutôt que de
      rester invisible pendant le chargement.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <title>GestLocPro — La gestion locative, tenue comme un patrimoine</title>
    <meta
      name="description"
      content="GestLocPro suit les loyers, l'eau et l'électricité, relance automatiquement les retards et archive vos états des lieux. Multi-devises, bilingue, pour propriétaires, gestionnaires et locataires."
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
