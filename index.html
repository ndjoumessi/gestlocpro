<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` : la moitié du traitement des encoches qui ne se voit
      pas dans le CSS, et sans laquelle l'autre moitié ne fait STRICTEMENT rien.

      Par défaut, le navigateur rétrécit la fenêtre d'affichage pour contourner
      l'encoche et la barre de gestes. Rien ne passe dessous — mais tous les
      `env(safe-area-inset-*)` valent alors 0. Un rembourrage bas calculé sur
      `safe-area-inset-bottom` se compile, s'affiche, et n'ajoute pas un pixel :
      une panne parfaitement silencieuse, invisible en relecture de diff comme
      dans un navigateur de bureau, où l'inset vaut 0 de toute façon.

      (Le nom de la classe n'est pas écrit ici sous sa forme Tailwind : le
      scanner lit ce fichier commentaires compris, et générerait pour de bon
      l'utilitaire nu cité en exemple.)

      Avec `cover`, la page couvre l'écran entier et les insets prennent enfin
      leurs vraies valeurs. C'est aussi ce qui rend cette ligne INSUFFISANTE
      seule, et même nuisible : ce qui touchait un bord passe désormais SOUS
      l'encoche, la Dynamic Island, la barre de gestes iOS ou la barre de
      navigation Android. Les rembourrages `env(...)` des surfaces collantes et
      fixes sont l'autre moitié obligatoire ; `src/design-system/zonesSures.test.ts`
      garde les deux ensemble pour qu'aucune ne parte sans l'autre.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!--
      L'ICÔNE D'ACCUEIL, 1024 px, ET POURQUOI ELLE N'EST PAS LE FAVICON.

      iOS ne lit PAS le SVG pour `apple-touch-icon` : sans cette ligne, ajouter
      le site à l'écran d'accueil produit une vignette de la page, illisible.
      Android la lit aussi, faute de manifeste.

      Elle est PLEINE, sans coins arrondis ni transparence, là où `/logo.svg` en
      porte : les deux systèmes posent leur propre masque, et une icône déjà
      arrondie se retrouve composée sur du noir dans ses coins. Le tracé vit dans
      `scripts/icone-app.mjs`, qui la régénère.
    -->
    <link rel="apple-touch-icon" href="/icone-1024.png" />

    <!--
      Thème explicite, posé AVANT le premier rendu.

      Le réglage SYSTÈME n'a pas besoin de ce script : `tokens.css` le traite en
      `@media (prefers-color-scheme: dark)`, donc il est déjà appliqué à la
      première peinture, sans JavaScript. Seul le choix explicite vit en
      stockage, et lui doit être posé avant que quoi que ce soit ne s'affiche —
      sinon quelqu'un qui a demandé le sombre reçoit un éclair de page claire le
      temps que React se monte.

      Ce script est donc volontairement bloquant et en tête de `<head>` : c'est
      la seule position qui garantisse l'attribut avant la première peinture.
      Il reste minuscule pour que ce blocage ne coûte rien de mesurable.

      Le `try` n'est pas décoratif : `localStorage` LÈVE une `SecurityError`
      quand l'accès est refusé (navigation privée, blocage tiers), et une
      exception ici, avant tout le reste, laisserait une page blanche. Voir
      `src/lib/stockage.ts`, qui applique la même prudence côté application.

      La clé et les valeurs doivent rester d'accord avec
      `src/theme/ThemeProvider.tsx`. L'absence de clé vaut « Système ».
    -->
    <script>
      try {
        var glTheme = localStorage.getItem('gestlocpro.theme')
        if (glTheme === 'light' || glTheme === 'dark')
          document.documentElement.setAttribute('data-theme', glTheme)
      } catch (e) {
        /* Préférence illisible : le réglage système s'applique, et c'est tout. */
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      UNE seule famille téléchargée, et c'est un choix de performance autant que
      de dessin.

      Le produit en chargeait deux — Playfair Display en six graisses, Inter en
      quatre. Sur le réseau du marché visé, chaque famille est un aller-retour
      de plus avant que le texte ne prenne sa forme définitive. La monospace
      était déjà passée à la pile système pour cette raison ; le corps de texte
      la rejoint.

      PLUS JAKARTA SANS AUX TITRES, après trois serifs.

      Playfair Display est parti pour sa modulation extrême, qui amincissait
      les déliés jusqu'à les faire disparaître en descendant. Fraunces l'a
      remplacé pour son axe de taille optique, mais son dessin très typé rendait
      les titres massifs. Source Serif 4 a tenu longtemps : un serif de LECTURE,
      contraste modéré, formes sans tic.

      Les trois répondaient à la même question — quel serif porte le mieux
      l'idée d'un produit patrimonial. C'est la QUESTION qui a changé : le
      produit assume un langage d'application, pas d'édition.

      Plus Jakarta Sans est une géométrique HUMANISTE. Le squelette est
      circulaire, mais les ouvertures restent larges et les terminaisons
      droites, ce qui la garde lisible quand un titre de carte descend à 20 px —
      ce que les géométriques pures ne tiennent pas à cette taille. Axe de
      graisse continu : une seule ressource couvre les quatre échelles.

      Plage `600..800` et non `600..700` : les échelles d'affichage sont passées
      à 800. Le 700 avait été retenu CONTRE les 900 d'origine parce qu'un serif
      à contraste modulé s'empâte quand on l'épaissit ; une sans à fût constant
      gagne en présence sans perdre ses contreformes. Demander une plage bornée
      allège quand même le fichier.

      `display=swap` : le texte s'affiche dans la police de repli plutôt que de
      rester invisible pendant le chargement. Le repli est désormais la PILE
      SYSTÈME et non Georgia — un repli doit être de la même nature que la
      police attendue, et substituer un serif à une sans faisait sauter la page
      entière. Le pire cas de `swap` est maintenant une page composée d'une
      seule famille, ce qui reste une page cohérente.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600..800&display=swap"
    />

    <title>GestLocPro — La gestion locative, tenue comme un patrimoine</title>
    <meta
      name="description"
      content="GestLocPro suit les loyers, l'eau et l'électricité, relance automatiquement les retards et archive vos états des lieux. Multi-devises, bilingue, pour propriétaires, gestionnaires et locataires."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
