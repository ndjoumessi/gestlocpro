# LA FUMÉE — SUR L'HÔTE VIVANT, ET ELLE NE JUGE PAS UN COMMIT.
#
# ═══ POURQUOI ELLE A QUITTÉ `portes` LE 2026-09-17 ═══
#
# Elle y était un cinquième travail, après `complet`. Railway déploie désormais
# SEULEMENT SI LES PORTES SONT VERTES (réglage « Wait for CI »), et sa
# documentation est explicite sur la maille : « Railway looks at the conclusion
# of each WORKFLOW RUN, not at individual jobs ».
#
# Une fumée restée dans `portes` aurait donc fermé une boucle : le déploiement
# attend la fin du workflow, le workflow attend la fumée, et la fumée attend le
# déploiement. Elle n'aurait pas bloqué — `continue-on-error` la fait conclure —
# mais elle aurait mesuré le déploiement PRÉCÉDENT à chaque poussée, en silence,
# et c'est exactement le faux vert que son propre en-tête disait éviter.
#
# ═══ POURQUOI ELLE N'EST PAS DÉCLENCHÉE PAR LA POUSSÉE ═══
#
# Tout workflow déclenché sur le commit poussé — `push`, `workflow_run` — entre
# dans l'ensemble que Railway attend, et ramène le même défaut. Le seul
# déclenchement qui échappe au commit est celui qui ne le vise pas : l'horloge,
# et la main.
#
# CE QUE CE DÉPLACEMENT COÛTE, ET IL FAUT LE DIRE : la fumée ne suit plus chaque
# déploiement. Elle ne répond plus à « ce commit-ci a-t-il cassé l'hôte ? » mais
# à « l'hôte est-il sain ce matin ? ». C'est une perte réelle, et elle est
# acceptée parce que ce travail n'a JAMAIS jugé un commit : `continue-on-error`
# était déjà là, et son en-tête disait déjà « il RAPPORTE ce que voit un
# visiteur ». Ce qu'il gardait de vraiment sien — surprendre un hôte qui sert
# autre chose que ce qu'on croit y avoir mis — un passage quotidien le garde.
#
# ═══ L'HEURE, ET ELLE EST CHOISIE ═══
#
# 5 h UTC. Un passage programmé porte le SHA de la pointe de branche : s'il
# démarrait pendant que Railway attend les portes d'une poussée fraîche, il
# retarderait ce déploiement du temps de son propre passage. 5 h UTC est le
# creux — les poussées de ce dépôt tombent le soir en Europe. Le risque restant
# est nommé plutôt que nié : environ un quart d'heure par jour où les deux
# peuvent se croiser, et la conséquence est un déploiement retardé de dix
# minutes, jamais un déploiement manqué.
#
# ═══ CE QU'ELLE OUVRE DEPUIS LE 2026-09-30 ═══
#
# Les vingt écrans de gestion sont montés sous `/demo` AUSSI, sur un parc de
# démonstration, SANS authentification. Le passage quotidien les ouvre donc tous,
# et les trente-cinq modales du registre avec — par le geste réel, menus de
# débordement et bascules de profil compris.
#
# C'est ce qui rend ce passage utile SANS IDENTIFIANTS, ce qu'il n'était pas :
# la passe connectée ne tourne que si quelqu'un pose un mot de passe dans
# l'environnement, donc jamais ici.
#
# LA QUESTION QU'IL RÉPOND : « l'hôte sert-il encore ces écrans ? ». Le
# discriminant n'est pas un code HTTP — le produit est une page unique, tout
# chemin rend 200 — mais l'ABSENCE de l'écran « introuvable ». Deux témoins
# négatifs tiennent la sonde : une adresse inventée qui DOIT rendre ce refus, un
# geste inventé qui NE doit PAS être trouvé. Les quatre détecteurs ont été
# éprouvés par mutation le 2026-09-30, chacun rouge avec son propre message.
#
# ═══ CE QU'ELLE NE FAIT TOUJOURS PAS ═══
#
# CE QUE `/demo` NE MONTRE PAS : un lot dont la surface est conditionnée à un
# vrai parc. `ReceiptModal` en est le cas — sa pièce jointe est gardée par
# `parkId`, absent en démonstration : la quittance s'ouvre, le geste n'y est pas.
# Ce passage ne couvre donc pas tout ce qui est déployé, et ne le prétend pas.
#
# SANS IDENTIFIANTS : la passe connectée reste à lancer à la main. Poser un mot
# de passe de production dans les secrets d'un dépôt pour qu'un robot le tape
# chaque matin est un prix qu'on ne paie pas pour de la mesure.

name: fumée

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  fumee:
    name: fumée — l'hôte vivant (rapport, pas verdict)
    runs-on: ubuntu-latest
    # 15 ET NON 10 DEPUIS LE 2026-09-30, ET LA MESURE A TRANCHÉ.
    #
    # Le balayage de la démonstration ajoute 55 surfaces — 81 s sur une machine
    # de développement, ce qui laissait croire que 10 minutes suffisaient
    # largement. Le PREMIER passage réel dit autre chose : 20 h 51 min 56 s à
    # 21 h 01 min 17 s, soit 9 min 21 s. Trente-neuf secondes de marge sous
    # l'ancien plafond.
    #
    # Ce ne sont pas les 81 s de mesure qui dominent : ce sont `npm ci`, le
    # téléchargement de Chromium et la construction. Un exécuteur un peu plus
    # lent, un cache manqué, et le passage se faisait couper — ce qui se lit
    # comme une panne d'hôte, pas comme un plafond trop bas.
    timeout-minutes: 15
    # `continue-on-error` EST LE POINT, pas une commodité. Une porte qui rougit
    # sur un DNS qui hoquette apprend à être ignorée, et c'est la seule façon de
    # perdre un outil pour de bon. Ce travail RAPPORTE ce que voit un visiteur.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # LA CONSTRUCTION, ET ELLE N'EST PAS DÉCORATIVE. Depuis le 2026-09-30, la
      # fumée compare le nom du paquet SERVI par `/api/version` à celui que cet
      # arbre construit — Vite le hache d'après le contenu, donc deux noms
      # différents sont deux codes différents. Sans `dist/`, elle n'a rien à
      # comparer et se TAIT : le contrôle existerait sans jamais rien dire.
      #
      # C'est ce contrôle qui répond à « la production sert-elle ce qu'on croit
      # y avoir mis ? », la question restée sans réponse quatre heures durant le
      # 2026-09-30 pendant qu'une porte rouge gelait le déploiement en silence.
      - run: npm run build
      - run: npm run fumee
