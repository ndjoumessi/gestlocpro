# LES PORTES TOURNENT AILLEURS QUE SUR LA MACHINE QUI LES A ÉCRITES.
#
# ═══ CE QUE CE FICHIER FERME ═══
#
# Ce dépôt a une culture de mesure peu commune — quatorze portes, des gardes du
# garde, des mutations. Elles ne tournaient QUE là où quelqu'un tapait
# `npm run check`, et quand il y pensait. Un oubli ne se voyait nulle part ; une
# machine différente n'était jamais essayée.
#
# Ce dernier point n'est pas théorique. `mesure-ui-aveugle-hors-demo` note déjà
# que la marge de 4 px des plafonds de débordement est « une prudence NON
# MESURÉE : sur cette machine deux exécutions rendent des maxima identiques au
# pixel ; une autre machine, avec d'autres métriques de police, n'a pas été
# essayée. » Voilà l'autre machine.
#
# ═══ TROIS ÉTAGES, ET LE DÉCOUPAGE EST CELUI DU TEMPS ═══
#
#   rapide    ~3 min   à chaque poussée, sur toute branche
#   serveur   ~3 min   à chaque poussée, avec un Postgres
#   complet  ~15 min   sur `main` seulement, et seulement si les deux passent
#
# Plus `polices`, qui n'est pas un étage : c'est un RELEVÉ, lancé à la demande
# (`workflow_dispatch`) et non à chaque poussée. Il a d'abord nommé ce que
# l'exécuteur met derrière `system-ui` ; il sert depuis à relever, sur cette
# machine, les plafonds en police large d'une branche avant de la pousser. Le
# garder automatique paierait un `playwright install` à chaque poussée pour une
# mesure qu'on ne lit qu'aux lots qui changent une hauteur.
#
# Le retour immédiat sans payer un quart d'heure à chaque commit. Les portes au
# navigateur sont les lentes — elles ouvrent Chromium sur onze largeurs et deux
# langues — et ce sont aussi celles qui ne changent d'avis qu'à la refonte.
#
# ═══ CE FICHIER TIENT DÉSORMAIS LA PRODUCTION, ET PAS SEULEMENT UN VERDICT ═══
#
# Railway ne déploie plus `main` sur la poussée : il attend la CONCLUSION de ce
# workflow (réglage « Wait for CI », activé le 2026-09-17). Ce qui rougit ici ne
# part donc plus en production — et c'est la BASE que cela protège d'abord :
# `prisma migrate deploy` s'exécute au démarrage du conteneur, si bien qu'une
# migration mal formée altérait le schéma de production un quart d'heure avant
# que qui que ce soit ne la juge.
#
# Le prix est une attente : un déploiement coûte désormais le temps de `complet`,
# environ vingt minutes, au lieu d'une.
#
# DEUX CONSÉQUENCES QUI SE LISENT AILLEURS DANS CE FICHIER. La première est le
# `cancel-in-progress` ci-dessous, qui n'annule JAMAIS sur `main` : la
# documentation de Railway le demande nommément pour un workflow dont dépend un
# déploiement, et ce fichier l'avait déjà pour une autre raison — deux arguments
# pour la même ligne. La seconde est le départ de `fumée`, qui vit maintenant
# dans `fumee.yml` : Railway attend le workflow ENTIER, et un travail qui mesure
# l'hôte déployé ne peut pas être dans ce qu'on attend pour déployer.
#
# ═══ LA LISTE DES PORTES N'EST PAS RECOPIÉE ICI, ET C'EST DÉLIBÉRÉ ═══
#
# Une liste recopiée se périme en silence : c'est la panne qu'`appariements.test.ts`
# a payée « pendant des lots », et que `mesure-ui` évite en LISANT ses adresses
# dans deux fichiers plutôt qu'en les écrivant. Le même raisonnement vaut ici.
# `package.json` porte donc `check:rapide` et `check:navigateur`, dont `check`
# est la composition ; ce fichier n'appelle que ces noms. Une porte ajoutée
# demain entre dans l'intégration continue sans que personne y touche.

name: portes

# `push` SEUL, ET `pull_request` RETIRE. Les deux ensemble faisaient tourner
# chaque travail DEUX FOIS sur toute branche de ce depot : les evenements
# produisent des `github.ref` differents — `refs/heads/x` contre
# `refs/pull/N/merge` — donc deux groupes de concurrence distincts, dont aucun
# n'annule l'autre. Une poussee sur une branche est deja couverte par `push` ;
# ce qu'on perdrait est la couverture des propositions venues d'un fork, que ce
# depot n'a pas.
on:
  push:
  workflow_dispatch:

# Une poussée qui en remplace une autre annule la précédente : sur une branche
# active, laisser tourner trois exécutions périmées coûte des minutes pour un
# verdict que personne ne lira.
# ANNULER, MAIS JAMAIS SUR `main`. Une poussee qui en remplace une autre sur une
# branche de travail annule la precedente, et c'est ce qu'on veut. Sur `main`,
# non : `complet` dure un quart d'heure, et deux fusions rapprochees
# annuleraient les portes au navigateur du PREMIER commit — deja en production,
# et dont la mise en page n'aurait jamais ete jugee. « Annule » se lit alors
# comme ni vert ni rouge, ce qui est la pire des trois reponses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # La version du `Dockerfile`, à la mineure près. Son commentaire dit pourquoi :
  # « construire avec un autre Node que celui où l'on éprouve les tests, c'est
  # déployer du code que personne n'a exécuté ». Une intégration continue qui
  # éprouverait sur une autre version démentirait cette phrase.
  NODE_VERSION: '20'

jobs:
  rapide:
    name: rapide — types, style, i18n, unités
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:rapide

  serveur:
    # PAS DE NOMBRE DE CAS DANS CE NOM. Il disait « 425 cas » et la suite en
    # comptait 436 — un nombre recopié dans une prose se périme en silence, et
    # celui-ci n'apprenait rien à qui lit le journal, où vitest écrit le compte
    # vrai à chaque exécution. C'est ce que la suite a de PARTICULIER qui mérite
    # d'être nommé : elle tourne sur un vrai Postgres, et non sur une doublure.
    name: serveur — sur un vrai Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # La même image que `docker-compose.yml` sert en développement. Éprouver
        # sur une autre version de Postgres que celle qu'on lance chez soi ferait
        # de l'intégration continue un second environnement à déboguer.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gestlocpro
          POSTGRES_PASSWORD: gestlocpro
          # Le nom DOIT finir par `_test` : `src/test/setupEnv.ts` refuse de
          # démarrer autrement, parce que la suite EFFACE la base qu'elle vise.
          POSTGRES_DB: gestlocpro_test
        options: >-
          --health-cmd "pg_isready -U gestlocpro -d gestlocpro_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      # `server/.env.test` est versionné et vise `localhost:5433`, le port du
      # `docker compose` local. Il ne gêne PAS ici : `process.loadEnvFile`
      # n'écrase jamais une variable déjà posée dans l'environnement — vérifié
      # plutôt que supposé — donc celle-ci l'emporte.
      DATABASE_URL: postgresql://gestlocpro:gestlocpro@localhost:5432/gestlocpro_test
      SESSION_SECRET: un-secret-d-integration-continue-assez-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      # `working-directory` ET NON `--prefix`, et la distinction a coûté une
      # exécution rouge : `--prefix` change où npm cherche le paquet, pas le
      # RÉPERTOIRE COURANT du programme lancé. Prisma cherchait donc son schéma
      # à la racine du dépôt — « prisma/schema.prisma: file not found ». Le
      # `Dockerfile` fait `cd server` pour exactement cette raison.
      #
      # Le client Prisma est GÉNÉRÉ, pas versionné : sans lui, `tsc -b` ne trouve
      # pas `src/generated/prisma` et rien ne compile.
      - run: npx prisma generate
        working-directory: server
      # `migrate deploy` et non `db push` : c'est le geste de la production, et
      # c'est lui qu'on veut voir échouer ici si une migration est mal formée.
      - run: npx prisma migrate deploy
        working-directory: server
      # Celui-ci reste à la racine : `npm --prefix server run check` lance un
      # SCRIPT, et npm exécute un script dans le répertoire de son paquet.
      - run: npm run check:server

  polices:
    name: polices — ce que la machine met derrière system-ui
    # À LA DEMANDE SEULEMENT. Voir l'en-tête : c'est un relevé, pas une porte.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Un RELEVÉ, pas une porte : il imprime des largeurs et ne refuse rien.
      # Il existe pour répondre à une question précise — `mesure-ui` rougit ici
      # sur cinq débordements que la machine de développement ne voit pas, et
      # seule la largeur du texte peut expliquer une dissymétrie pareille.
      - run: node scripts/releve-polices-machine.mjs
      # LE SECOND RELEVÉ : LES HAUTEURS QUE CETTE MACHINE SEULE PEUT MESURER.
      #
      # `plafond-hauteurs` porte deux colonnes de plafonds, et la seconde
      # appartient à CET exécuteur : sous police large, la même page d'accueil
      # rend 10530 px sur la machine de développement et 10197 ici. Une colonne
      # large inscrite depuis un relevé local serait fausse de plusieurs
      # centaines de pixels — mesuré le 2026-09-09, pas supposé.
      #
      # `--relever` NE REFUSE RIEN : il imprime la table à recopier. C'est un
      # relevé, comme celui du dessus, et c'est pourquoi il vit dans ce travail
      # à la demande plutôt que dans une porte.
      #
      # La construction est ici parce que ce script mesure `dist/` et refuse un
      # paquet périmé ; ce travail, lui, ne construisait rien.
      - run: npm run build
      - run: node scripts/plafond-hauteurs.mjs --relever
        env:
          MESURER_EN_POLICE_LARGE: '1'
      # LE TROISIÈME : LA VITRINE EN POLICE LARGE, depuis une BRANCHE.
      #
      # `plafond-vitrine` tourne déjà en police large dans `complet` — mais
      # `complet` ne tourne que sur `main`, donc APRÈS la poussée qui change la
      # page. Relever `plafondLarge` avant de pousser exigeait d'ajouter ce pas à
      # la main sur une branche de mesure, puis de le retirer : trois lots de
      # septembre l'ont fait (34755807766 en premier). Il reste ici désormais.
      #
      # `continue-on-error` parce que c'est un RELEVÉ : la hauteur mesurée
      # s'imprime AVANT le verdict, et c'est justement quand elle dépasse le
      # plafond inscrit qu'on la vient lire. Le verdict qui compte reste celui de
      # `complet`, sur `main`.
      - run: node scripts/plafond-vitrine.mjs
        continue-on-error: true
        env:
          MESURER_EN_POLICE_LARGE: '1'

  complet:
    name: complet — les portes au navigateur
    # SUR `main`, et seulement après les deux autres. Un quart d'heure de
    # Chromium à chaque poussée de branche coûterait plus que ce qu'il rapporte :
    # ces portes gardent la mise en page, qui ne bouge qu'aux lots de refonte, et
    # `main` est ce qui part en production.
    #
    # ET À LA DEMANDE, DEPUIS N'IMPORTE QUELLE BRANCHE — c'est le seul ajout.
    #
    # L'exemption repose sur une prémisse : « la mise en page ne bouge qu'aux
    # lots de refonte ». Elle est juste la plupart du temps, et c'est ce qui la
    # rend coûteuse quand elle est fausse : un lot qui déplace des panneaux, des
    # modales et des jetons est PRÉCISÉMENT celui dont le verdict arrive après la
    # fusion, sur ce qui part en production. Le lot du mouvement, en septembre,
    # a dû lancer ces portes à la main quinze fois sur une machine locale — et
    # `modales` est connue pour diverger entre le local et l'intégration, dans
    # les deux sens.
    #
    # Le même remède existait déjà un travail plus haut : `polices` porte un
    # relevé côté branche « parce que `complet` ne tourne que sur `main`, donc
    # APRÈS la poussée qui change la page », et trois lots de septembre avaient
    # ajouté ce pas à la main avant qu'il n'y reste. On généralise ce remède au
    # lieu de le recopier une quatrième fois.
    #
    # Le compromis de coût est INTACT : rien ne change pour une poussée
    # ordinaire, `workflow_dispatch` est un geste délibéré, et `needs` tient
    # toujours — on ne paie Chromium qu'après deux portes vertes.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [rapide, serveur]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # UNE VRAIE BASE, ET ELLE MANQUAIT DEPUIS LE 2026-08-31.
    #
    # `espace-connecte` est entrée dans la chaîne ce jour-là (`5ceb7eb`) : elle
    # monte SEPT vraies sessions derrière un vrai serveur, donc elle sème un vrai
    # parc. Ce travail n'en avait aucune, et adressait de toute façon Postgres par
    # le nom d'un conteneur de la machine de développement. Le rouge est resté
    # caché quatre jours derrière `modales`, qui s'arrêtait avant elle.
    #
    # La même image et les mêmes identifiants que le travail `serveur` : éprouver
    # sur une autre version que celle qu'on lance chez soi ferait de l'intégration
    # continue un second environnement à déboguer.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gestlocpro
          POSTGRES_PASSWORD: gestlocpro
          POSTGRES_DB: gestlocpro_test
        options: >-
          --health-cmd "pg_isready -U gestlocpro -d gestlocpro_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `--with-deps` installe les bibliothèques système de Chromium, que
      # l'image d'exécution ne porte pas. Sans elles, le navigateur se lance et
      # meurt sur une erreur de lien dynamique.
      - run: npx playwright install --with-deps chromium
      # LES DÉPENDANCES DU SERVEUR, ET ELLES SONT NOUVELLES ICI.
      #
      # `politique-de-securite` est la seule porte au navigateur qui monte le
      # VRAI serveur — `app.ts` en mode production, avec ses en-têtes — plutôt
      # que `vite preview`, qui n'en pose aucun. Une politique de sécurité
      # n'existe que dans la réponse du serveur ; la mesurer derrière un serveur
      # qui ne la pose pas ne mesurerait rien.
      #
      # Elle construit `server/dist` elle-même, mais ne peut pas inventer les
      # dépendances ni le client Prisma, qui est GÉNÉRÉ et non versionné. Ces
      # deux étapes-là sont donc ici — les mêmes que dans le travail `serveur`,
      # et pour la même raison.
      - run: npm --prefix server ci
      # `DATABASE_URL` EST EXIGÉ POUR GÉNÉRER, PAS POUR SE CONNECTER.
      #
      # `prisma.config` le résout à la lecture du fichier de configuration :
      # sans lui, `generate` s'arrête sur « Cannot resolve environment
      # variable » avant d'avoir écrit une ligne. L'adresse est syntaxiquement
      # valide et jamais jointe, comme celle que
      # `scripts/politique-de-securite.mjs` passe à son serveur.
      #
      # CE COMMENTAIRE DISAIT « ici il n'en faut aucune — CE TRAVAIL NE REQUÊTE
      # RIEN, il construit un client et ouvre des écrans rendus côté client ».
      # C'était vrai jusqu'au 2026-08-31 : `espace-connecte` sème depuis ce
      # jour-là un vrai parc dans une vraie base. Le service ci-dessus la
      # fournit, et `PORTE_BASE` dit à la porte où la trouver. L'adresse
      # injoignable reste juste POUR `generate`, qui ne se connecte pas.
      #
      # CE DÉFAUT A ÉTÉ PAYÉ : la machine de développement porte `server/.env`,
      # qui fournit la variable, et aucun essai local ne pouvait donc le voir.
      - run: npx prisma generate
        working-directory: server
        env:
          DATABASE_URL: postgresql://porte:porte@127.0.0.1:1/porte_qui_ne_se_joint_pas
      # `mesure-ui` construit `dist/` lui-même, en premier — les portes
      # suivantes servent ce paquet-là. Rien à construire avant.
      #
      # EN POLICE LARGE, ET C'EST TOUT L'INTÉRÊT. `system-ui` vaut DejaVu Sans
      # sur cet exécuteur ; le commutateur impose Verdana, qui y retombe sur
      # DejaVu faute d'être installée — et surtout, il SÉLECTIONNE les plafonds
      # mesurés sous police large.
      #
      # CE COMMENTAIRE DISAIT « les deux machines comparent alors la même chose
      # au même nombre : ici et sur la machine de développement,
      # `MESURER_EN_POLICE_LARGE=1 npm run check:navigateur` rend le même
      # verdict ». MESURÉ LE 2026-09-04, ET C'EST FAUX : la même commande rend
      # 6 plaintes sur la machine de développement contre 4 ici. Les deux qui
      # divergent sont `ParkSettings@1280/en` (315 px ici-bas contre 251) et
      # `ParkSettings·devise@1280/en` (427 contre 362) — la même dissymétrie de
      # LARGEUR de texte que `releve-polices-machine` a relevée, et qui ne
      # touche que le défilement.
      #
      # LE COMMUTATEUR RAPPROCHE LES DEUX MACHINES, IL NE LES CONFOND PAS.
      # C'est la porte PUBLIQUE qui fait autorité, et les plafonds sont posés
      # sur SES relevés : un plafond calé sur la machine la plus large cesserait
      # de refuser quoi que ce soit ici. Une divergence locale se lit donc comme
      # telle, et ne se corrige pas en desserrant le plafond.
      - run: npm run check:navigateur
        env:
          MESURER_EN_POLICE_LARGE: '1'
          # L'ORIGINE, SANS NOM DE BASE : `espace-connecte` en dérive celle
          # qu'elle sème (`gestlocpro_porte`) et `postgres` pour la créer.
          PORTE_BASE: postgresql://gestlocpro:gestlocpro@localhost:5432
      # Les captures que `poids-ecrans` régénère : c'est la seule sortie
      # regardable d'un échec de mise en page, et elle disparaît avec la machine.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures/
          retention-days: 7
          if-no-files-found: ignore
